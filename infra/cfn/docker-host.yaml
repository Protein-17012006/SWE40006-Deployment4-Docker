AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SWE40006 Task 4 - one Docker host (the second Docker device): VPC, security group, Session Manager role and an
  Amazon Linux 2023 instance with Docker Engine, the Docker Compose plugin and an Elastic IP.

Parameters:
  ProjectName:
    Type: String
    Default: swe40006-a4
    AllowedPattern: "^[a-z0-9-]+$"
    Description: Prefix for every name and export.
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small]
    Description: Free-plan eligible sizes only.
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: The current Amazon Linux 2023 AMI. A newer AMI on a stack update replaces the instance.
  RootVolumeGiB:
    Type: Number
    Default: 30
    MinValue: 30
    MaxValue: 60
  ComposeVersion:
    Type: String
    Default: v5.6.0
    AllowedPattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
    Description: Docker Compose release installed as a Docker CLI plugin (Amazon Linux 2023 does not package it).
  ComposeSha256:
    Type: String
    Default: 40343e21ca777173e69cff5dbafeb37c6f81f3b0d57d9e597f036e95eb63e76a
    AllowedPattern: "^[0-9a-f]{64}$"
    Description: SHA-256 of docker-compose-linux-x86_64 for ComposeVersion, as published with the release.

Resources:
  # ---------- network ----------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-vpc" }, { Key: Project, Value: !Ref ProjectName }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-igw" }, { Key: Project, Value: !Ref ProjectName }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-public" }, { Key: Project, Value: !Ref ProjectName }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-public" }, { Key: Project, Value: !Ref ProjectName }]

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App ports only. No SSH - the instance is managed with Session Manager.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: Quick Poll (Task 4.3) }
        - { IpProtocol: tcp, FromPort: 4000, ToPort: 4000, CidrIp: 0.0.0.0/0, Description: friendlyhello (Task 4.2) }
        - { IpProtocol: tcp, FromPort: 2323, ToPort: 2323, CidrIp: 0.0.0.0/0, Description: Connect Four (Task 4.4) }
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0, Description: "Docker Hub, Amazon Linux repositories, GitHub releases, SSM" }
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-docker-host" }, { Key: Project, Value: !Ref ProjectName }]

  # ---------- Session Manager only: the containers never get AWS credentials ----------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Docker host - Session Manager and Run Command only.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ---------- the Docker host ----------
  # The Elastic IP sits on a network interface that exists before the instance boots, so the
  # instance has internet access during bootstrap and can send its cfn-signal.
  Eip:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-eip" }, { Key: Project, Value: !Ref ProjectName }]

  NetworkInterface:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref PublicSubnet
      GroupSet: [!Ref InstanceSecurityGroup]
      Description: !Sub "${ProjectName} Docker host"
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

  EipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt Eip.AllocationId
      NetworkInterfaceId: !Ref NetworkInterface

  Instance:
    Type: AWS::EC2::Instance
    DependsOn: [EipAssociation, DefaultRoute, PublicSubnetRouteTable]
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT15M
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      CreditSpecification: { CPUCredits: standard }
      NetworkInterfaces:
        - NetworkInterfaceId: !Ref NetworkInterface
          DeviceIndex: "0"
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeGiB
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-docker-host" }, { Key: Project, Value: !Ref ProjectName }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Bootstrap of the Docker host. Log: /var/log/cloud-init-output.log (read it with Session Manager).
          set -uo pipefail
          status=0
          fail() { echo "FAILED: $*"; status=1; }

          echo "== 1 GiB swap file"
          if [ ! -f /swapfile ]; then
            { dd if=/dev/zero of=/swapfile bs=1M count=1024 && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile &&
              echo "/swapfile none swap sw 0 0" >> /etc/fstab; } || fail "swap file"
          fi

          echo "== Docker Engine and the CloudFormation helper scripts (Amazon Linux 2023 repository)"
          dnf install -y docker aws-cfn-bootstrap || fail "dnf install"
          rpm -q amazon-ssm-agent || dnf install -y amazon-ssm-agent || fail "SSM agent"
          systemctl enable --now amazon-ssm-agent || fail "SSM agent start"

          echo "== Docker daemon settings: rotate container logs, keep containers up while dockerd restarts"
          mkdir -p /etc/docker
          cat > /etc/docker/daemon.json <<'JSON'
          {
            "log-driver": "json-file",
            "log-opts": { "max-size": "10m", "max-file": "3" },
            "live-restore": true
          }
          JSON
          systemctl enable --now docker || fail "docker service"

          echo "== Docker Compose ${ComposeVersion} as a Docker CLI plugin, checked against its pinned SHA-256"
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL --retry 5 -o /tmp/docker-compose \
            "https://github.com/docker/compose/releases/download/${ComposeVersion}/docker-compose-linux-x86_64" || fail "Compose download"
          { echo "${ComposeSha256}  /tmp/docker-compose" | sha256sum -c - &&
            install -m 0755 /tmp/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose; } || fail "Compose checksum"
          rm -f /tmp/docker-compose

          echo "== Folder for the Compose projects"
          install -d -m 0750 /opt/${ProjectName}

          echo "== Check"
          docker info --format 'Docker Engine {{.ServerVersion}} | storage {{.Driver}} | logs {{.LoggingDriver}} | live-restore {{.LiveRestoreEnabled}}' || fail "docker info"
          docker compose version || fail "docker compose"

          /opt/aws/bin/cfn-signal -e $status --stack ${AWS::StackName} --resource Instance --region ${AWS::Region}

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub "${ProjectName}-VpcId" }
  SubnetId:
    Value: !Ref PublicSubnet
    Export: { Name: !Sub "${ProjectName}-SubnetId" }
  SecurityGroupId:
    Value: !Ref InstanceSecurityGroup
    Export: { Name: !Sub "${ProjectName}-SecurityGroupId" }
  InstanceId:
    Value: !Ref Instance
    Export: { Name: !Sub "${ProjectName}-InstanceId" }
  PublicIp:
    Description: Elastic IP of the Docker host - the public address in the report.
    Value: !Ref Eip
    Export: { Name: !Sub "${ProjectName}-PublicIp" }
  AmiUsed:
    Description: The Amazon Linux 2023 AMI that the SSM parameter resolved to.
    Value: !Ref AmiId
