# Quick Poll reverse proxy. nginx resolves "web" through Compose's DNS once, at start; Compose restarts it when web is recreated.
upstream quickpoll_web {
    server web:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 16k;

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;    # overwrite whatever the client sent

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Server-Sent Events: no buffering, long-lived responses.
    location ~ ^/p/[A-Za-z0-9]+/events$ {
        proxy_pass http://quickpoll_web;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://quickpoll_web;
        proxy_read_timeout 30s;
    }
}
