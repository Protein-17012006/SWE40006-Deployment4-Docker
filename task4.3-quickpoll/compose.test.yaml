# Runs the whole test suite in Linux, including the tests marked "db" that need PostgreSQL:
#   docker compose -f compose.test.yaml run --rm --build tests
name: quickpoll-test

services:
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: quickpoll_test
      POSTGRES_USER: quickpoll
      POSTGRES_PASSWORD: test-only
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickpoll -d quickpoll_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql://quickpoll:test-only@postgres-test:5432/quickpoll_test
    volumes:
      - ./:/app
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
    depends_on:
      postgres-test:
        condition: service_healthy
