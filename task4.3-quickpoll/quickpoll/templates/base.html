<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Quick Poll{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Quick&nbsp;Poll</a>
    <span class="tagline">Ask a question, share the link, watch the votes arrive.</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="host">{{ footer }}</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
